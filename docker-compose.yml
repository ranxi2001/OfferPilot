services:
  api:
    build: .
    ports:
      - "${OFFERPILOT_API_BIND:-127.0.0.1}:${OFFERPILOT_API_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - MIMO_API_KEY=${MIMO_API_KEY}
      - MIMO_BASE_URL=${MIMO_BASE_URL}
      - MIMO_ASR_MODEL=${MIMO_ASR_MODEL}
      - MIMO_TTS_MODEL=${MIMO_TTS_MODEL}
      - MIMO_TTS_VOICE=${MIMO_TTS_VOICE:-alloy}
      - MIMO_ASR_LANGUAGE=${MIMO_ASR_LANGUAGE:-auto}
      - OFFERPILOT_API_KEY=${OFFERPILOT_API_KEY}
      - OFFERPILOT_REQUIRE_AUTH=true
      - OFFERPILOT_ALLOWED_ORIGINS=${OFFERPILOT_ALLOWED_ORIGINS:-http://localhost:3000}
      - OFFERPILOT_MAX_INTERVIEW_BODY_BYTES=${OFFERPILOT_MAX_INTERVIEW_BODY_BYTES:-2097152}
      - OFFERPILOT_HARNESS_MAX_CONCURRENT=${OFFERPILOT_HARNESS_MAX_CONCURRENT:-4}
      - OFFERPILOT_CONFIG_PATH=/app/config/.env
      - DB_PATH=/app/data/offerpilot.db
      - KNOWLEDGE_DIR=/app/knowledge
      - LOG_LEVEL=info
    volumes:
      - app-data:/app/data
      - app-config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3001/health/ready >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://api:3001
      - OFFERPILOT_API_KEY=${OFFERPILOT_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OPENAI_TTS_MODEL=${OPENAI_TTS_MODEL}
      - OPENAI_ASR_MODEL=${OPENAI_ASR_MODEL}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - MIMO_API_KEY=${MIMO_API_KEY}
      - MIMO_BASE_URL=${MIMO_BASE_URL}
      - MIMO_ASR_MODEL=${MIMO_ASR_MODEL}
      - MIMO_TTS_MODEL=${MIMO_TTS_MODEL}
      - MIMO_TTS_VOICE=${MIMO_TTS_VOICE:-alloy}
      - MIMO_ASR_LANGUAGE=${MIMO_ASR_LANGUAGE:-auto}
      - OFFERPILOT_PROJECT_ROOT=/app
      - OFFERPILOT_CONFIG_PATH=/app/config/.env
      - OFFERPILOT_ENABLE_CONFIG_API=${OFFERPILOT_ENABLE_CONFIG_API:-false}
      - OFFERPILOT_HEALTH_TIMEOUT_MS=${OFFERPILOT_HEALTH_TIMEOUT_MS:-3000}
    volumes:
      - app-config:/app/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  app-data:
  app-config:
